<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obstbau Messung</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F7D1E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F2F4EE;--surf:#fff;--ink:#16291C;--mute:#5A6B5E;--line:#D5DACF;--acc:#3F7D1E;--acc-ink:#fff;--warn:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A13;--surf:#18251C;--ink:#E8EFE6;--mute:#9DB0A1;--line:#2B3C2F;--acc:#8FD061;--acc-ink:#0E1B10;--warn:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101A13;--surf:#18251C;--ink:#E8EFE6;--mute:#9DB0A1;--line:#2B3C2F;--acc:#8FD061;--acc-ink:#0E1B10;--warn:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 4px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav button{flex:1 1 30%;padding:10px 2px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;font-weight:600}
nav button[aria-current="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
button.b{padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;margin-top:10px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;border:0;color:var(--warn);font-size:20px;padding:0 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tg button{flex:1 1 45%;margin-top:0}
.target{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:8px}
.target small{display:block;font-size:14px;font-weight:400;color:var(--mute)}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;padding:14px 10px}
.status{font-size:14px;margin:6px 0 0;color:var(--mute)}.status.on{color:var(--acc);font-weight:600}
.last{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0 2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:10px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
li input{width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px}
.mute{color:var(--mute);font-size:14px}.err{color:var(--warn);font-size:15px;font-weight:600;min-height:22px;margin:4px 0 0}
.var{border-top:1px solid var(--line);padding:10px 0}
details{margin-top:6px}summary{cursor:pointer;font-weight:600;padding:6px 0}
textarea{min-height:200px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0}.ck input{width:auto}
textarea.sc{min-height:90px}

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:7px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tb th{color:var(--mute);font-weight:600;border-top:0}.tb th:first-child,.tb td:first-child{text-align:left}
.tb td:first-child{white-space:normal;overflow-wrap:anywhere;max-width:105px}
.sx{overflow-x:auto}
.wrap{position:relative;margin-top:12px}
.tip{position:absolute;top:0;width:170px;font-size:12px;line-height:1.35;white-space:nowrap;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 8px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.lgs{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0;font-size:14px}.lg{white-space:nowrap}
.hb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px;font-variant-numeric:tabular-nums}
.hl{width:78px;flex:none;color:var(--mute)}.ht{flex:1;height:16px}
.hf{display:block;height:100%;min-width:0;background:var(--s1);border-radius:0 4px 4px 0}
.hn{width:70px;flex:none;text-align:right}
#lock{position:fixed;inset:0;z-index:50;background:#000;color:#9fb8a4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;touch-action:none;user-select:none}
#lock .lt{font-size:30px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Obstbau Messung</h1>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<div id="lock" hidden><div class="lt" id="lt"></div><p>Gesperrt. Zum Entsperren 2 Sekunden gedrückt halten.</p></div>
<script>
const KEY='obst-proto-v2';
let shareId=null;
const ARTEN=['Fruchtdurchmesser','Stammdurchmesser','Triebzuwachs'];
const DEF=()=>({trials:[],runs:[],ms:[],cfg:{person:'',sound:true,vib:true,lim:{Fruchtdurchmesser:[20,120],Stammdurchmesser:[5,200],Triebzuwachs:[0,200]}},sel:{t:null,art:ARTEN[0],run:null,pos:null}});
let S=DEF(),tab='messen',mem=null,openV=null,showPos=false,showInfo=false,locked=false,wl=null,ac=null,lockTimer=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){if(mem)S=mem}}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>n.toFixed(2).replace('.',',');
const fdt=ts=>new Date(ts).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const trial=()=>S.trials.find(t=>t.id===S.sel.t);
const run=()=>S.runs.find(r=>r.id===S.sel.run);

/* ---------- Ton ---------- */
const SND={ok:[[[880,.08]],40],tree:[[[880,.09],[1175,.12]],[60,60,60]],variant:[[[660,.12],[880,.12],[1175,.3]],[100,60,100,60,200]],done:[[[1175,.12],[880,.12],[660,.12],[523,.45]],[300,100,300]],warn:[[[170,.55,'sawtooth']],500]};
const LEG=[['ok','Ein kurzer hoher Ton','Wert gespeichert, weiter mit der nächsten Frucht.'],['tree','Zwei Töne aufsteigend','Baum fertig, weiter mit dem nächsten Baum.'],['variant','Drei Töne aufsteigend','Variante fertig, weiter mit der nächsten Variante.'],['done','Vier Töne absteigend','Durchgang abgeschlossen.'],['warn','Tiefer, langer Brummton','Wert unplausibel und nicht gespeichert. Bitte neu messen.']];
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function snd(k,force){
  const [seq,vib]=SND[k];
  if(S.cfg.sound||force){initAudio();try{let t=ac.currentTime;seq.forEach(([f,d,ty])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d+.05})}catch(e){}}
  if(S.cfg.vib&&!force){try{navigator.vibrate&&navigator.vibrate(vib)}catch(e){}}
}

/* ---------- Messplan-Logik ---------- */
const flat=()=>{const t=trial();return t?t.variants.flatMap(v=>(t.plan||[]).map(p=>({v:v.id,vn:v.name,tree:p.tree,n:p.n}))):[]};
const cnt=(v,tree)=>S.ms.filter(m=>m.run===S.sel.run&&m.v===v&&m.tree===tree).length;
const done=x=>cnt(x.v,x.tree)>=x.n;
function nextFrom(i){const f=flat();for(let k=1;k<=f.length;k++){const x=f[(i+k)%f.length];if(!done(x))return x}return null}
function cur(){
  const f=flat();if(!f.length||!S.sel.run)return null;
  const p=S.sel.pos,i=p?f.findIndex(x=>x.v===p.v&&x.tree===p.tree):-1;
  if(i>=0&&!done(f[i]))return f[i];
  return nextFrom(i);
}

/* ---------- Navigation ---------- */
function nav(){
  const T=[['messen','Messen'],['versuche','Versuche'],['ausw','Auswertung'],['export','Export'],['einst','Einstellungen']];
  $('#nav').innerHTML=T.map(([k,l])=>`<button data-tab="${k}" aria-current="${tab===k}">${l}</button>`).join('');
}
function show(t){tab=t;nav();({messen:vMessen,versuche:vVersuche,export:vExport,einst:vEinst,ausw:vAusw})[t]()}

/* ---------- Versuche ---------- */
function planTxt(t){const p=t.plan||[];if(!p.length)return 'fehlt noch';return `${p.length} Bäume je Variante · je ${p[0].n} Früchte`}
function planHtml(t){
  const p=t.plan||[];
  return `<details data-vd="${t.id}"${openV===t.id||!p.length?' open':''}><summary>Messplan: ${planTxt(t)}</summary>
  <p class="mute">Gilt für jede Variante dieses Versuchs.</p>
  <div class="row"><div><label for="pb-${t.id}">Bäume je Variante</label><input id="pb-${t.id}" type="number" inputmode="numeric" min="1" value="${p.length||''}"></div>
  <div><label for="pf-${t.id}">Früchte je Baum</label><input id="pf-${t.id}" type="number" inputmode="numeric" min="1" value="${p.length?p[0].n:''}"></div></div>
  <button class="b g" data-mkplan="${t.id}">Messplan speichern</button>
  </details>`;
}
function vVersuche(){
  const list=S.trials.map(t=>`<div class="card"><h2>${esc(t.name)}</h2>
    <div class="mute">${esc(t.betrieb)}${t.parzelle?' · Parzelle '+esc(t.parzelle):''}${t.sorte?' · '+esc(t.sorte):''}</div>
    <div class="chips">${t.variants.map(v=>`<span class="chip">${esc(v.name)}</span>`).join('')||'<span class="mute">Noch keine Variante</span>'}</div>
    <div class="row"><div><label for="nv-${t.id}">Neue Variante</label><input id="nv-${t.id}" placeholder="z. B. Kontrolle"></div>
    <button class="b g" data-add-var="${t.id}">Hinzufügen</button></div>
    ${planHtml(t)}
    <div class="tg"><button class="b" data-go="${t.id}">Hier messen</button><button class="b g" data-share="${t.id}">Versuch teilen</button></div>${shareId===t.id?`<label for="sc-${t.id}">Code zum Weitergeben (kopieren, auf dem anderen Gerät importieren)</label><textarea id="sc-${t.id}" class="sc" readonly>${enc(t)}</textarea>`:''}</div>`).join('');
  $('#view').innerHTML=`<div class="card"><h2>Neuer Versuch</h2>
    <label for="tb">Betrieb (Pflicht)</label><input id="tb">
    <label for="tn">Name des Versuchs (Pflicht)</label><input id="tn" placeholder="z. B. Wasserprojekt">
    <label for="tp">Parzelle</label><input id="tp">
    <label for="ts">Sorte</label><input id="ts">
    <p class="err" id="te"></p><button class="b" id="addT">Versuch anlegen</button></div>
    <div class="card"><h2>Versuch importieren</h2><p class="mute">Code von einem anderen Gerät einfügen, damit derselbe Versuch auch hier vorhanden ist.</p>
    <textarea id="ic" class="sc" aria-label="Versuchscode"></textarea><p class="err" id="ie"></p><button class="b g" id="impT">Importieren</button></div>${list}`;
}
function addTrial(){
  const betrieb=$('#tb').value.trim(),name=$('#tn').value.trim();
  if(!betrieb||!name){$('#te').textContent='Betrieb und Name sind Pflichtfelder.';return}
  const t={id:uid(),betrieb,name,parzelle:$('#tp').value.trim(),sorte:$('#ts').value.trim(),variants:[],plan:[]};
  S.trials.push(t);if(!S.sel.t)S.sel.t=t.id;save();vVersuche();
}
const enc=t=>'OBST1:'+btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify({id:t.id,betrieb:t.betrieb,name:t.name,parzelle:t.parzelle||'',sorte:t.sorte||'',plan:t.plan||[],variants:t.variants.map(v=>({id:v.id,name:v.name}))}))));
const dec=c=>{const b=c.replace(/\s+/g,'');if(b.indexOf('OBST1:')!==0)throw 0;const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b.slice(6)),x=>x.charCodeAt(0))));if(!o.id||!o.betrieb||!o.name||!Array.isArray(o.variants))throw 0;return o};
const tv=s=>{const [a,b]=s.split('|');return {t:S.trials.find(x=>x.id===a),tree:+b}};

/* ---------- Messen ---------- */
function pickRun(){const r=S.runs.filter(x=>x.t===S.sel.t&&x.art===S.sel.art).pop();S.sel.run=r?r.id:null;S.sel.pos=null}
function vMessen(){
  const ts=S.trials.filter(x=>x.variants.length&&(x.plan||[]).length);
  if(!ts.length){
    $('#view').innerHTML=`<div class="card"><h2>Noch kein Messplan vorhanden</h2>
      <p class="mute">Lege unter „Versuche“ einen Versuch mit Varianten und Messplan an, oder lade Beispieldaten zum Ausprobieren.</p>
      <button class="b" id="demo">Beispieldaten laden</button></div>`;return}
  if(!ts.some(x=>x.id===S.sel.t)){S.sel.t=ts[0].id;pickRun()}
  const tO=ts.map(x=>`<option value="${x.id}"${x.id===S.sel.t?' selected':''}>${esc(x.betrieb)}: ${esc(x.name)}</option>`).join('');
  const aO=ARTEN.map(a=>`<option${a===S.sel.art?' selected':''}>${a}</option>`).join('');
  $('#view').innerHTML=`<div class="card">
    <label for="st">Versuch</label><select id="st">${tO}</select>
    <div class="row"><div><label for="sa">Messart</label><select id="sa">${aO}</select></div><button class="b g" id="newRun">Neuer Durchgang</button></div>
    <p class="mute" id="runinfo"></p></div>
  <div class="card"><div class="target" id="target"></div>
    <input id="inp" class="big" inputmode="decimal" autocomplete="off" placeholder="20,50" aria-label="Messwert in Millimeter">
    <p class="status" id="stat"></p><p class="err" id="me" role="alert"></p>
    <div class="last" id="last">–</div><div class="stats" id="stats"></div>
    <div class="tg"><button class="b g" id="tSound"></button><button class="b g" id="tLock">Tasche-Modus</button><button class="b g" id="tInfo">Töne erklärt</button><button class="b g" id="tPos">Reihenfolge ändern</button></div>
    <div id="info" hidden><ul>${LEG.map(([k,a,b])=>`<li><span><b>${a}:</b> ${b}</span><button class="b g" style="margin:0" data-snd="${k}">Probe</button></li>`).join('')}</ul></div>
    <div id="posbox" hidden><div class="row"><div><label for="sv">Variante</label><select id="sv"></select></div><div><label for="sb">Baum</label><select id="sb"></select></div></div></div>
  </div>
  <div class="card"><h2>Letzte Messungen</h2><ul id="hist"></ul><button class="b g" id="undo">Letzte Messung zurücknehmen</button></div>`;
  refreshM();const i=$('#inp');if(i)i.focus();
}
function refreshM(){
  if(tab!=='messen'||!$('#target'))return;
  const x=cur(),f=flat(),r=run();
  $('#runinfo').textContent=r?`Durchgang vom ${fdt(r.ts)}${r.person?' · '+r.person:''}`:'Kein Durchgang aktiv. Mit „Neuer Durchgang“ starten.';
  const tot=f.reduce((a,y)=>a+y.n,0),got=f.reduce((a,y)=>a+Math.min(cnt(y.v,y.tree),y.n),0);
  let tt;
  if(!r)tt='Durchgang starten';
  else if(!x)tt='Durchgang abgeschlossen';
  else tt=`${esc(x.vn)}<br>Baum ${x.tree} · Frucht ${cnt(x.v,x.tree)+1} von ${x.n}`;
  $('#target').innerHTML=tt+(r?`<small>${got} von ${tot} Früchten im Durchgang</small>`:'');
  $('#lt').innerHTML=tt;
  const inp=$('#inp');inp.disabled=!(r&&x);
  const ms=S.ms.filter(m=>m.run===S.sel.run);
  const lastm=ms[ms.length-1];
  $('#last').textContent=lastm?fmt(lastm.val)+' mm':'–';
  const vv=x?ms.filter(m=>m.v===x.v).map(m=>m.val):[],n=vv.length,mean=n?vv.reduce((a,b)=>a+b,0)/n:0;
  $('#stats').innerHTML=[['n',n],['Mittel',n?fmt(mean):'–'],['Min',n?fmt(Math.min(...vv)):'–'],['Max',n?fmt(Math.max(...vv)):'–']].map(([l,v])=>`<div><b>${v}</b><span>${l}${x?' (Variante)':''}</span></div>`).join('');
  const vn=id=>{const t=trial(),v=t&&t.variants.find(y=>y.id===id);return v?v.name:'?'};
  $('#hist').innerHTML=ms.slice(-8).reverse().map(m=>`<li><span>${esc(vn(m.v))} · B${m.tree} F${m.fruit} · <b>${fmt(m.val)} mm</b></span><button class="x" data-del="${m.id}" aria-label="Messung löschen">×</button></li>`).join('')||'<li class="mute">Noch keine Messung in diesem Durchgang.</li>';
  $('#tSound').textContent='Ton: '+(S.cfg.sound?'an':'aus');
  $('#info').hidden=!showInfo;$('#posbox').hidden=!showPos;
  if(showPos){
    const vs=[...new Map(f.map(y=>[y.v,y.vn]))];
    $('#sv').innerHTML=vs.map(([id,nm])=>`<option value="${id}"${x&&x.v===id?' selected':''}>${esc(nm)}</option>`).join('');
    const cv=x?x.v:(vs[0]&&vs[0][0]);
    $('#sb').innerHTML=f.filter(y=>y.v===cv).map(y=>`<option value="${y.tree}"${x&&x.tree===y.tree?' selected':''}>Baum ${y.tree}${done(y)?' (fertig)':''}</option>`).join('');
  }
}
function record(raw){
  const x=cur(),err=$('#me');
  if(!x){err.textContent='Kein offener Messplatz. Durchgang starten oder Messplan prüfen.';return snd('warn')}
  const val=parseFloat(String(raw).trim().replace(',','.')),[lo,hi]=S.cfg.lim[S.sel.art]||[0,1000];
  if(!isFinite(val)||val<lo||val>hi){err.textContent=`Wert „${raw}“ unplausibel (erlaubt: ${lo} bis ${hi} mm). Bitte neu messen.`;snd('warn');return}
  err.textContent='';
  const fruit=cnt(x.v,x.tree)+1;
  S.ms.push({id:uid(),run:S.sel.run,v:x.v,tree:x.tree,fruit,art:S.sel.art,val,person:S.cfg.person||'',ts:new Date().toISOString()});
  let ev='ok';
  if(fruit>=x.n){
    const f=flat();ev='tree';
    if(f.filter(y=>y.v===x.v).every(done))ev='variant';
    if(f.every(done))ev='done';
    const nx=nextFrom(f.findIndex(y=>y.v===x.v&&y.tree===x.tree));
    if(nx)S.sel.pos={v:nx.v,tree:nx.tree};
  }
  save();snd(ev);refreshM();
}
function demo(){
  const t={id:uid(),betrieb:'Demo-Hof',name:'Wasserprojekt (Demo)',parzelle:'1',sorte:'Gala',plan:[{tree:1,n:3},{tree:2,n:3},{tree:3,n:2}],variants:[
    {id:uid(),name:'Kontrolle'},{id:uid(),name:'Tropfbewässerung'}]};
  S.trials.push(t);S.sel.t=t.id;pickRun();save();vMessen();
}
async function setLock(on){
  locked=on;$('#lock').hidden=!on;
  try{if(on&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen')}else if(wl){await wl.release();wl=null}}catch(e){}
  const i=$('#inp');if(i&&!i.disabled)i.focus();
}

/* ---------- Auswertung ---------- */
let A={t:null,art:null,run:null,mode:'mean',vsel:'*'},CH=null;
const mn=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>a.length>1?Math.sqrt(a.reduce((s,x)=>s+(x-mn(a))**2,0)/(a.length-1)):null;
const fnum=v=>String(+(+v).toFixed(2)).replace('.',',');
const fd=ts=>new Date(ts).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'});
const fdl=ts=>new Date(ts).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});
const SCOL=i=>`var(--s${i+1})`;
function aRuns(t,art){
  return S.runs.filter(r=>r.t===t.id&&r.art===art).map(r=>{const ms=S.ms.filter(m=>m.run===r.id&&m.art===art);
    return ms.length?{r,ms,ts:ms.map(m=>m.ts).sort()[0]}:null}).filter(Boolean).sort((a,b)=>a.ts<b.ts?-1:1)}
const rvals=(x,v)=>x.ms.filter(m=>m.v===v.id).map(m=>m.val);
function ticks(lo,hi,n){const span=(hi-lo)||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,r=[];for(let v=a;v<=b+st/2;v+=st)r.push(+v.toFixed(10));return r}
function chart(slots,series,fmtv,unit){
  const W=360,H=230,l=40,r=series.length<=4?66:14,t=18,b=26,pw=W-l-r,ph=H-t-b;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!all.length)return '<p class="mute">Keine Werte für das Diagramm.</p>';
  let lo=Math.min(...all),hi=Math.max(...all);if(S_growth())lo=Math.min(lo,0),hi=Math.max(hi,0);
  const tk=ticks(lo,hi,4),y0=tk[0],y1=tk[tk.length-1],py=v=>t+ph-(v-y0)/(y1-y0||1)*ph;
  const x0=Math.min(...slots.map(s=>s.ts)),x1=Math.max(...slots.map(s=>s.ts)),px=ts=>l+(x1===x0?.5:(ts-x0)/(x1-x0))*pw;
  let g=`<text x="${l}" y="9" font-size="10" fill="var(--mute)">${unit}</text>`;
  tk.forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${py(v)+3.5}" text-anchor="end" font-size="10" fill="var(--mute)">${fnum(v)}</text>`});
  const step=Math.ceil(slots.length/5);
  slots.forEach((s,i)=>{if(i%step===0||i===slots.length-1)g+=`<text x="${px(s.ts)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mute)">${fd(s.ts)}</text>`});
  const ends=[];
  series.forEach(s=>{
    let seg=[];const flush=()=>{if(seg.length>1)g+=`<path d="M${seg.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="${SCOL(s.i)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;seg=[]};
    s.vals.forEach((v,k)=>{if(v==null){flush();return}seg.push([px(slots[k].ts),py(v)])});flush();
    s.vals.forEach((v,k)=>{if(v!=null)g+=`<circle cx="${px(slots[k].ts)}" cy="${py(v)}" r="4" fill="${SCOL(s.i)}" stroke="var(--surf)" stroke-width="2"/>`});
    let k=s.vals.length-1;while(k>=0&&s.vals[k]==null)k--;if(k>=0)ends.push({s,x:px(slots[k].ts),y:py(s.vals[k])});
  });
  if(series.length<=4){ends.sort((a,b)=>a.y-b.y);let last=-99;ends.forEach(e=>{e.ly=Math.max(e.y,last+12);last=e.ly;
    const nm=e.s.name.length>9?e.s.name.slice(0,8)+'…':e.s.name;g+=`<text x="${e.x+8}" y="${e.ly+3.5}" font-size="10.5" fill="var(--ink)">${esc(nm)}</text>`})}
  CH={W,px:slots.map(s=>px(s.ts)),lab:slots.map(s=>fdl(s.ts)),rows:slots.map((s,k)=>series.filter(q=>q.vals[k]!=null).map(q=>[q.name,fmtv(q.vals[k]),SCOL(q.i)]))};
  return `<div class="wrap"><svg id="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Liniendiagramm der Varianten" style="touch-action:pan-y"><g>${g}</g><line id="chx" y1="${t}" y2="${t+ph}" stroke="var(--mute)" stroke-width="1" style="visibility:hidden"/></svg><div id="tip" class="tip" hidden></div></div>`;
}
const S_growth=()=>A.mode==='growth';
function chHover(e){const svg=e.target.closest&&e.target.closest('#ch');if(!svg||!CH)return;
  const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*CH.W;let k=0,d=1e9;
  CH.px.forEach((p,i)=>{if(Math.abs(p-x)<d){d=Math.abs(p-x);k=i}});
  const tip=$('#tip'),cx=$('#chx');cx.setAttribute('x1',CH.px[k]);cx.setAttribute('x2',CH.px[k]);cx.style.visibility='visible';
  tip.innerHTML=`<b>${CH.lab[k]}</b>`+CH.rows[k].map(r=>`<div><span class="dot" style="background:${r[2]}"></span>${esc(r[0])}: <b>${r[1]}</b></div>`).join('');
  tip.hidden=false;const wb=svg.parentElement.getBoundingClientRect(),left=(b.left-wb.left)+CH.px[k]/CH.W*b.width;
  tip.style.left=Math.max(0,Math.min(left-75,wb.width-175))+'px'}
function vAusw(){
  const ts=S.trials.filter(t=>ARTEN.some(a=>aRuns(t,a).length));
  if(!ts.length){$('#view').innerHTML=`<div class="card"><h2>Noch keine Messungen</h2><p class="mute">Sobald du einen Durchgang gemessen hast, erscheint hier die Auswertung.</p></div>`;return}
  if(!ts.some(t=>t.id===A.t))A.t=ts[0].id;
  const t=S.trials.find(x=>x.id===A.t),arts=ARTEN.filter(a=>aRuns(t,a).length);
  if(!arts.includes(A.art))A.art=arts[0];
  const runs=aRuns(t,A.art);
  if(!runs.some(x=>x.r.id===A.run))A.run=runs[runs.length-1].r.id;
  const cr=runs.find(x=>x.r.id===A.run),cap=t.variants.slice(0,6);
  const opt=(arr,cur,f)=>arr.map(x=>`<option value="${f[0](x)}"${f[0](x)===cur?' selected':''}>${f[1](x)}</option>`).join('');
  // Kennzahlen
  const rows=t.variants.map(v=>{const a=rvals(cr,v);return a.length?`<tr><td>${esc(v.name)}</td><td>${a.length}</td><td><b>${fnum(mn(a))}</b></td><td>${sd(a)==null?'–':fnum(sd(a))}</td><td>${fnum(Math.min(...a))}</td><td>${fnum(Math.max(...a))}</td></tr>`:`<tr><td>${esc(v.name)}</td><td colspan="5" class="mute">keine Messung</td></tr>`}).join('');
  // Verlauf
  const growth=S_growth();
  const slots=(growth?runs.slice(1):runs).map(x=>({ts:Date.parse(x.ts),x}));
  const series=cap.map((v,i)=>{
    const m=runs.map(x=>{const a=rvals(x,v);return a.length?mn(a):null});
    let vals;
    if(!growth)vals=m;else vals=runs.slice(1).map((x,k)=>{const d=(Date.parse(x.ts)-Date.parse(runs[k].ts))/864e5;return (m[k]!=null&&m[k+1]!=null&&d>=1)?(m[k+1]-m[k])/d*7:null});
    return {name:v.name,i,vals}}).filter(s=>s.vals.some(v=>v!=null));
  const fv=growth?(v=>(v>=0?'+':'')+fnum(v)+' mm'):(v=>fnum(v)+' mm');
  let verlauf;
  if(!slots.length)verlauf='<p class="mute">Für das Wachstum braucht es mindestens zwei Messtermine.</p>';
  else if(!series.length)verlauf='<p class="mute">Zu wenig Werte. Wachstum wird nur zwischen Terminen berechnet, die mindestens einen Tag auseinanderliegen.</p>';
  else{
    const leg=series.map(s=>`<span class="lg"><span class="dot" style="background:${SCOL(s.i)}"></span>${esc(s.name)}</span>`).join('');
    const th=series.map(s=>`<th>${esc(s.name)}</th>`).join('');
    const tr=slots.map((s,k)=>`<tr><td>${fd(s.ts)}</td>${series.map(q=>`<td>${q.vals[k]==null?'–':(growth&&q.vals[k]>=0?'+':'')+fnum(q.vals[k])}</td>`).join('')}</tr>`).join('');
    verlauf=chart(slots,series,fv,growth?'mm je 7 Tage':'mm')+`<div class="lgs">${leg}</div>${t.variants.length>6?'<p class="mute">Die Grafik zeigt die ersten 6 Varianten.</p>':''}
      <details><summary>Werte als Tabelle (${growth?'mm je 7 Tage':'Mittelwert in mm'})</summary><div class="sx"><table class="tb"><thead><tr><th>Datum</th>${th}</tr></thead><tbody>${tr}</tbody></table></div></details>`;
  }
  // Verteilung
  const w=+S.cfg.cls>0?+S.cfg.cls:5;
  const vv=t.variants.some(v=>v.id===A.vsel)?A.vsel:'*';
  const dv=cr.ms.filter(m=>vv==='*'||m.v===vv).map(m=>m.val);
  let dist='<p class="mute">Keine Messungen.</p>';
  if(dv.length){
    const lo=Math.floor(Math.min(...dv)/w)*w,nb=Math.floor((Math.max(...dv)-lo)/w)+1;
    if(nb>80)dist='<p class="mute">Zu viele Klassen. Bitte die Klassenbreite erhöhen.</p>';
    else{const c=Array(nb).fill(0);dv.forEach(x=>c[Math.floor((x-lo)/w)]++);const mx=Math.max(...c);
      dist=c.map((n,i)=>`<div class="hb"><span class="hl">${fnum(lo+i*w)}–${fnum(lo+(i+1)*w)}</span><span class="ht"><span class="hf" style="width:${n/mx*100}%"></span></span><span class="hn">${n}${n?` · ${Math.round(n/dv.length*100)} %`:''}</span></div>`).join('')}
  }
  $('#view').innerHTML=`<div class="card"><label for="at" style="margin-top:0">Versuch</label><select id="at">${opt(ts,A.t,[x=>x.id,x=>esc(x.betrieb)+': '+esc(x.name)])}</select>
    <label for="aa">Messart</label><select id="aa">${opt(arts,A.art,[x=>x,x=>x])}</select></div>
  <div class="card"><h2>Kennzahlen</h2><label for="ar" style="margin-top:0">Messtermin</label><select id="ar">${opt(runs,A.run,[x=>x.r.id,x=>fdl(x.ts)+(x.r.person?' · '+esc(x.r.person):'')+' · '+x.ms.length+' Messungen'])}</select>
    <div class="sx"><table class="tb"><thead><tr><th>Variante</th><th>n</th><th>Mittel</th><th>±</th><th>Min</th><th>Max</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="mute">Werte in mm. ± ist die Standardabweichung.</p></div>
  <div class="card"><h2>Verlauf</h2><div class="tg"><button class="b ${growth?'g':''}" data-amode="mean" aria-pressed="${!growth}">Mittelwert</button><button class="b ${growth?'':'g'}" data-amode="growth" aria-pressed="${growth}">Wachstum je 7 Tage</button></div>${verlauf}</div>
  <div class="card"><h2>Verteilung</h2><p class="mute">Für den oben gewählten Messtermin.</p>
    <div class="row"><div><label for="av">Variante</label><select id="av"><option value="*"${vv==='*'?' selected':''}>Alle zusammen</option>${opt(t.variants,vv,[x=>x.id,x=>esc(x.name)])}</select></div>
    <div><label for="ac">Klassenbreite (mm)</label><input id="ac" type="number" inputmode="decimal" min="0.5" step="0.5" value="${w}"></div></div><div style="margin-top:10px">${dist}</div></div>`;
}

/* ---------- Testdaten ---------- */
function tdRemove(){const ids=S.runs.filter(r=>S.trials.some(t=>t.id===r.t&&t.demo)).map(r=>r.id);
  S.ms=S.ms.filter(m=>!ids.includes(m.run));S.runs=S.runs.filter(r=>!ids.includes(r.id));S.trials=S.trials.filter(t=>!t.demo);
  if(!S.trials.some(t=>t.id===S.sel.t)){S.sel.t=null;S.sel.run=null;S.sel.pos=null}}
function tdLoad(){
  tdRemove();
  let seed=12345;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const gauss=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(2*Math.PI*rnd());
  const names=['Kontrolle','Tropfbewässerung','Mulch','Reduziert','Stress'],fac=[1,1.08,1.04,.93,.8];
  const t={id:'demo-wasser',demo:true,betrieb:'Testhof',name:'Wasserprojekt (Testdaten)',parzelle:'Test',sorte:'Gala',plan:[1,2,3,4].map(i=>({tree:i,n:10})),variants:names.map((n,i)=>({id:'demo-v'+i,name:n}))};
  S.trials.push(t);
  const off=t.variants.map(()=>t.plan.map(()=>gauss()*1.2));
  const today=new Date();today.setHours(10,0,0,0);
  [28,21,14,7,0].forEach((back,k)=>{
    const d0=new Date(today.getTime()-back*864e5),r={id:'demo-r'+k,t:t.id,art:'Fruchtdurchmesser',person:'Test',ts:d0.toISOString()};S.runs.push(r);
    const day=28-back;let n=0;
    t.variants.forEach((v,vi)=>{t.plan.forEach((p,pi)=>{const treeOff=off[vi][pi];for(let f=1;f<=p.n;f++){
      const val=32+fac[vi]*(day*0.55-day*day*0.004)+treeOff+gauss()*1.6;
      S.ms.push({id:'demo-'+k+'-'+vi+'-'+p.tree+'-'+f,run:r.id,v:v.id,tree:p.tree,fruit:f,art:r.art,val:Math.round(val*100)/100,person:'Test',ts:new Date(d0.getTime()+(n++)*20000).toISOString()})}})});
  });
  S.sel.t=t.id;S.sel.art='Fruchtdurchmesser';S.sel.run='demo-r4';S.sel.pos=null;A.t=t.id;A.art='Fruchtdurchmesser';A.run='demo-r4';A.vsel='*';
  save();
}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
  if(el.id==='tdLoad'){tdLoad();show('ausw')}
  else if(el.id==='tdDel'){tdRemove();A.t=null;A.run=null;save();vEinst();const m=$('#tdMsg');if(m)m.textContent='Testdaten entfernt.'}});

function csv(){
  const rows=['Datum;Uhrzeit;Person;Betrieb;Versuch;Versuch_ID;Parzelle;Sorte;Variante;Durchgang;Durchgang_ID;Baum;Frucht;Messart;Wert_mm'];
  const q=x=>String(x).replace(/[;\r\n]+/g,' ');
  S.ms.forEach(m=>{const r=S.runs.find(x=>x.id===m.run),t=r&&S.trials.find(x=>x.id===r.t),v=t&&t.variants.find(x=>x.id===m.v),d=new Date(m.ts),rd=r?new Date(r.ts):null;
    rows.push([d.toLocaleDateString('de-CH'),d.toLocaleTimeString('de-CH'),q(m.person||(r&&r.person)||''),q(t?t.betrieb:''),q(t?t.name:''),t?t.id:'',q(t?t.parzelle:''),q(t?t.sorte:''),q(v?v.name:''),rd?rd.toLocaleDateString('de-CH'):'',r?r.id:'',m.tree,m.fruit,m.art,String(m.val).replace('.',',')].join(';'))});
  return rows.join('\n');
}

  if(id==='st'){S.sel.t=t.value;pickRun();save();vMessen()}
  else if(id==='sa'){S.sel.art=t.value;pickRun();save();vMessen()}
  else if(id==='sv'){const f=flat().filter(y=>y.v===t.value),x=f.find(y=>!done(y))||f[0];if(x){S.sel.pos={v:x.v,tree:x.tree};save();refreshM();$('#inp').focus()}}
  else if(id==='sb'){S.sel.pos={v:$('#sv').value,tree:+t.value};save();refreshM();$('#inp').focus()}
  else if(id==='cp'){S.cfg.person=t.value.trim();save()}
  else if(id==='cs'){S.cfg.sound=t.checked;save()}
  else if(id==='cv'){S.cfg.vib=t.checked;save()}
  else if(t.dataset.lim){const [a,i]=t.dataset.lim.split('|'),n=parseFloat(String(t.value).replace(',','.'));if(isFinite(n)){S.cfg.lim[a][+i]=n;save()}}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.vd){if(d.open)openV=d.dataset.vd;else if(openV===d.dataset.vd)openV=null}},true);
document.addEventListener('keydown',e=>{
  if(e.target.id==='inp'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';if(v.trim())record(v)}
});
document.addEventListener('focusin',e=>{if(e.target.id==='inp'){const s=$('#stat');s.className='status on';s.textContent='Bereit. Taste an der Schieblehre drücken.'}});
document.addEventListener('focusout',e=>{
  if(e.target.id==='inp'){const s=$('#stat');if(s){s.className='status';s.textContent='Feld antippen, um die Eingabe zu aktivieren.'}
    if(locked)setTimeout(()=>{const i=$('#inp');if(i&&!i.disabled)i.focus()},30)}
});
const L=$('#lock');
L.addEventListener('pointerdown',e=>{e.preventDefault();clearTimeout(lockTimer);lockTimer=setTimeout(()=>setLock(false),2000)});
['pointerup','pointercancel','pointerleave'].forEach(n=>L.addEventListener(n,()=>clearTimeout(lockTimer)));
['touchstart','touchmove','mousedown','contextmenu'].forEach(n=>L.addEventListener(n,e=>e.preventDefault(),{passive:false}));

load();
S.trials.forEach(t=>{if(!t.plan){const w=t.variants.find(v=>v.plan&&v.plan.length);t.plan=w?w.plan:[]}});
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
show('messen');
</script>
</body>
